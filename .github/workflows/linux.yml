name: Linux
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.deps/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg
      VCPKG_DISABLE_METRICS: 1
      VCPKG_MAX_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v4
      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}
      - name: Set up pinned vcpkg
        run: bash scripts/bootstrap.sh
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release -j4
      - name: Test
        run: ctest --preset release
      - name: Run offline demonstration
        run: python3 scripts/demo.py build/release/backupctl --work demo-data
      - name: Check dense-data restore measurement
        run: >-
          python3 benchmarks/restore_scale.py build/release/backupctl
          --work benchmark-data/restore-smoke --output restore-smoke-results
          --size-mib 16 --small-files 64
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-diagnostics
          path: |
            build/release/Testing/Temporary/LastTest.log
            build/release/compile_commands.json
            demo-data/events.jsonl
            restore-smoke-results/
          if-no-files-found: ignore
      - name: Package Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: backupctl-linux-x64
          path: build/release/backupctl
  checks:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [clang, asan, tsan]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.deps/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg
      VCPKG_DISABLE_METRICS: 1
      VCPKG_MAX_CONCURRENCY: 4
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/vcpkg
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}
      - run: bash scripts/bootstrap.sh
      - name: Install the cached dependency build
        run: cmake --preset release
      - name: Configure compiler or sanitizer
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/build/release/vcpkg_installed
          -DVCPKG_MANIFEST_INSTALL=OFF
      - run: cmake --build --preset ${{ matrix.preset }} -j4
      - run: ctest --preset ${{ matrix.preset }}
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
